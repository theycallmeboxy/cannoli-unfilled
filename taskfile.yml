version: '3'

vars:
  KITCHEN_SRC: ../cannoli-kitchen
  KITCHEN_DEST: app/src/main/assets/kitchen

tasks:
  credits:sync:
    desc: Sync credits.json to CreditsData.kt
    cmds:
      - python3 scripts/sync_credits.py

  credits:contributors:
    desc: Refresh localization contributors in credits.json from Crowdin, then resync
    cmds:
      - python3 scripts/sync_crowdin_contributors.py
      - python3 scripts/sync_credits.py

  kitchen:
    desc: Build cannoli-kitchen and copy dist into app assets
    dir: '{{.KITCHEN_SRC}}'
    cmds:
      # build-only skips vue-tsc, which cannot run under bun (Volar .vue resolution breaks); run `bun run type-check` under Node for the type gate
      - bun run build-only
      - rm -rf {{.USER_WORKING_DIR}}/{{.KITCHEN_DEST}}/*
      - cp -R dist/. {{.USER_WORKING_DIR}}/{{.KITCHEN_DEST}}/
